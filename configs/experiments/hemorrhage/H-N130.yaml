experiment:
  name: H-N130-nnunet-case-component-sampling
  dataset_id: 1
  dataset_name: ICHBinary
  configuration: 3d_fullres
  fold: 0
  device: auto
  continue_training: false
  validation_checkpoint: best_composite
plans: {base_identifier: nnUNetPlans, output_identifier: ICHPlansCaseComponentSamplingV1, patch_size: [20, 320, 256], batch_size: 2}
trainer:
  epochs: 300
  iterations_per_epoch: 250
  validation_iterations_per_epoch: 50
  save_every: 5
  learning_rate: 0.01
  weight_decay: 0.00003
  oversample_foreground_percent: 0.50
  optimizer: {name: sgd, momentum: 0.99, nesterov: true}
  scheduler: {name: poly}
loss: {name: dice_ce, include_background: false, dice_weight: 1.0, ce_weight: 1.0, smooth: 0.00001}
checkpoint: {dice_weight: 0.5, recall_weight: 0.5, min_delta: 0.0001}
pruning: {enabled: true, monitor: composite, min_epochs: 200, patience: 30, min_delta: 0.001}
network: {name: default}
sampling:
  enabled: true
  strategy: case_and_component
  volume_thresholds_ml: [1.0, 5.0, 20.0]
  weights: {negative: 1.0, lt_1ml: 4.0, 1_to_5ml: 2.0, 5_to_20ml: 1.5, ge_20ml: 1.0}
  component_weights: {lt_1ml: 8.0, 1_to_5ml: 4.0, 5_to_20ml: 2.0, ge_20ml: 1.0}
