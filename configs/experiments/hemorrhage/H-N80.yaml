experiment:
  name: H-N80-nnunet-baseline-tversky-ce
  dataset_id: 1
  dataset_name: ICHBinary
  configuration: 3d_fullres
  fold: 0
  device: auto
  continue_training: false
  validation_checkpoint: best_composite
plans: {base_identifier: nnUNetPlans, output_identifier: ICHPlansBaselineTverskyV1, patch_size: [20, 320, 256], batch_size: 2}
trainer:
  epochs: 300
  iterations_per_epoch: 250
  validation_iterations_per_epoch: 50
  save_every: 5
  learning_rate: 0.01
  weight_decay: 0.00003
  oversample_foreground_percent: 0.33
  optimizer: {name: sgd, momentum: 0.99, nesterov: true}
  scheduler: {name: poly}
loss: {name: tversky_ce, include_background: false, tversky_weight: 1.0, ce_weight: 1.0, alpha: 0.3, beta: 0.7, smooth: 0.00001}
checkpoint: {dice_weight: 0.5, recall_weight: 0.5, min_delta: 0.0001}
pruning: {enabled: true, monitor: composite, min_epochs: 200, patience: 30, min_delta: 0.001}
network: {name: default}
sampling: {enabled: false}
