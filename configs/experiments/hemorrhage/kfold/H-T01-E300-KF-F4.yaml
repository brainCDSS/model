checkpoint:
  dice_weight: 0.5
  min_delta: 0.0001
  recall_weight: 0.5
experiment:
  configuration: 3d_fullres
  continue_training: false
  dataset_id: 1
  dataset_name: ICHBinary
  device: auto
  fold: 4
  name: H-T01-E300-KF-F4
  validation_checkpoint: best_composite
full_validation:
  archive_every_epoch: true
  enabled: true
  interval: 5
  keep_top_k: 3
  neighborhood_radius: 4
loss:
  alpha: 0.4
  beta: 0.6
  ce_weight: 1.0
  include_background: false
  name: tversky_ce
  smooth: 1.0e-05
  tversky_weight: 1.0
network:
  name: default
plans:
  base_identifier: nnUNetPlans
  batch_size: 2
  output_identifier: ICHPlansTuneA04B06SgdKFoldV1
  patch_size:
  - 20
  - 320
  - 256
pruning:
  enabled: false
  min_delta: 0.001
  min_epochs: 300
  monitor: composite
  patience: 30
sampling:
  enabled: false
trainer:
  epochs: 300
  iterations_per_epoch: 250
  learning_rate: 0.01
  optimizer:
    momentum: 0.99
    name: sgd
    nesterov: true
  oversample_foreground_percent: 0.33
  save_every: 1
  scheduler:
    name: poly
  validation_iterations_per_epoch: 50
  weight_decay: 3.0e-05
