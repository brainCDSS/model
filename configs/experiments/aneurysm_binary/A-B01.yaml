experiment:
  name: A-B01
  dataset_id: 503
  dataset_name: TopAneuMRABinary
  configuration: 3d_fullres
  fold: 0
  device: cuda
  continue_training: false
  validation_checkpoint: best_full_macro
plans:
  base_identifier: nnUNetPlans
  output_identifier: AneurysmBinaryPlansDiceCENoSmoothV1
  patch_size: [80, 192, 160]
  batch_size: 2
trainer:
  epochs: 300
  iterations_per_epoch: 250
  validation_iterations_per_epoch: 50
  save_every: 1
  learning_rate: 0.01
  weight_decay: 0.00003
  oversample_foreground_percent: 0.33
  optimizer: {name: sgd, momentum: 0.99, nesterov: true}
  scheduler: {name: poly}
loss: {name: dice_ce, include_background: false, dice_weight: 1.0, ce_weight: 1.0, smooth: 0.0}
checkpoint: {dice_weight: 0.5, recall_weight: 0.5, min_delta: 0.0001}
pruning: {enabled: false, monitor: composite, min_epochs: 150, patience: 30, min_delta: 0.001}
network: {name: default}
sampling: {enabled: false}
full_validation:
  enabled: true
  start_epoch: 200
  interval: 10
  archive_every_epoch: true
  keep_top_k: 3
  neighborhood_radius: 5
paths:
  data_root: /home/stu03/workspace/datasets/aneurysm/v2/model_ready/nnunet
  results_root: /home/stu03/workspace/model/runs/aneurysm_binary/nnunet
