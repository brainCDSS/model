experiment_id: A-N00
task: aneurysm
target: location

model:
  name: nnunet
  variant: standard

nnunet:
  configuration: 3d_fullres
  fold: 0
  trainer: nnUNetTrainerAneurysmEarlyStopping

training:
  max_epochs: 300
  iterations_per_epoch: 250
  validation_iterations_per_epoch: 50
  learning_rate: 0.01
  weight_decay: 0.00003
  oversample_foreground_percent: 0.33

early_stopping:
  enabled: true
  monitor: ema_fg_dice
  patience: 30
  min_delta: 0.0001
  start_epoch: 0

checkpoint:
  save_every: 1
  resume: true

progress:
  every_iterations: 25
