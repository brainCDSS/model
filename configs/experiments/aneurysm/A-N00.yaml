experiment_id: A-N00
task: aneurysm
target: location

model:
  name: nnunet
  variant: standard

nnunet:
  configuration: 3d_fullres
  fold: 0
  trainer: nnUNetTrainerAneurysmEarlyStopping

training:
  max_epochs: 300
  iterations_per_epoch: 250

  # Patch validation은 학습 상태 확인용 diagnostic.
  # Best checkpoint / EarlyStopping에는 사용하지 않는다.
  validation_iterations_per_epoch: 50

  learning_rate: 0.01
  weight_decay: 0.00003
  oversample_foreground_percent: 0.33

validation:
  online_patch:
    iterations_per_epoch: 50
    role: diagnostic_only

  patient_full_volume:
    enabled: true
    every_epoch: true
    expected_cases: 46

    # Location label 1~52를 환자 단위 foreground로 병합하여
    # 개별 환자 Dice / Precision / Recall 계산
    foreground_definition: labels_1_to_52_merged

    # GT 없음 + Prediction 없음은 Dice=1로 보상하지 않음
    empty_gt_empty_pred: exclude_from_patient_mean

    # Location Macro metric은 Validation GT에 실제 존재하는
    # class만 동일 가중치로 평균
    macro_class_scope: gt_present_classes_only

    # 각 환자별 Macro Dice 역시 해당 환자의 GT에
    # 실제 존재하는 Location class만 동일 가중치로 평균
    patient_macro_class_scope: gt_present_classes_per_patient_only

    metrics:
      - patient_mean_dice
      - patient_median_dice
      - patient_macro_dice
      - patient_mean_macro_dice
      - patient_mean_precision
      - patient_mean_recall
      - macro_dice
      - macro_precision
      - macro_recall
      - negative_case_fp_rate

early_stopping:
  enabled: true

  # Best checkpoint와 EarlyStopping의 공식 기준
  monitor: val_patient_mean_dice

  patience: 30
  min_delta: 0.0001
  start_epoch: 0

checkpoint:
  best_monitor: val_patient_mean_dice
  save_every: 1
  resume: true

progress:
  # Train / Online Patch Validation
  every_iterations: 25

  # 46명 Full-volume Validation
  every_validation_patient: 1
