[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "brainon-ai"
version = "0.1.0"
description = "Reproducible medical-image segmentation experiments for BrainOn"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "nibabel>=5.2,<6",
  "matplotlib>=3.8,<4",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
monai = ["monai>=1.3"]
nnunet = ["nnunetv2>=2.4"]
mlflow = ["mlflow>=2.12"]
storage = ["google-cloud-storage>=2.16"]
notebook = ["jupyterlab>=4", "nbstripout>=0.7"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pre-commit>=3.7"]

[project.scripts]
brainon = "brainon_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brainon_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

